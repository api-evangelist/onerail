rfc9457: false
summary: OneRail does not use RFC 9457 application/problem+json. Every error across both APIs is returned
  as application/json using a single Error envelope with a numeric code, a required human-readable message,
  a free-form errors object, and an optional errorDetails array. The errorDetails entries borrow RFC 6901
  JSON Pointer semantics to point at the offending field in the request document, which is the closest
  thing OneRail publishes to a machine-actionable error contract. Validation failures on some Delivery
  API endpoints use a second shape with a top-level 'Validation errors' message and an errors[] array
  carrying a location object.
envelope:
  media_type: application/json
  schema: openapi/onerail-delivery-api-openapi.yml#/components/schemas/Error
  fields:
  - field: code
    type: integer
    required: false
    description: Numeric error code
  - field: message
    type: string
    required: true
    description: Human-readable error message
  - field: errors
    type: object
    required: false
    description: Free-form map of field errors
  - field: errorDetails
    type: array
    required: false
    description: Array of detail/pointer objects
  - field: errorDetails[].detail
    type: string
    required: true
    description: A human-readable explanation specific to this occurrence of the problem
  - field: errorDetails[].pointer
    type: string
    required: false
    description: A JSON Pointer (RFC 6901) to the associated entity in the request document
validation_envelope:
  source: https://developer.onerail.io/hc/en-us/articles/53169025821339-CapacityConnect-API-Quickstart-Guide
  fields:
  - field: message
