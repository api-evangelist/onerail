      operationId: advanceOrder
      tags:
      - Order
      requestBody:
        description: Body specifying the action to carry out
        content:
          application/json:
            schema:
              required:
              - label
              - orderId
              type: object
              properties:
                label:
                  type: string
                  description: Action to carry out
                  enum:
                  - ready_to_pack
                  - ready_to_ship
                  - manually_assign_carrier
                  - dispatch_delivery
                orderId:
                  type: string
                  format: uuid
                  description: The Id of the order
                data:
                  type: object
                  description: Extra optional data to pass in
                  properties:
                    box:
                      type: object
                      description: Optional. LxWxH properties of the box to create
                      properties:
                        lengthIn:
                          type: number
                          description: Length in inches
                        widthIn:
                          type: number
                          description: Width in inches
                        heightIn:
                          type: number
                          description: Height in inches
                    lpContractSlaId:
                      type: string
                      format: uuid
                      description: Optional. The ID of the LP contract SLA
                    deliveryId:
                      type: string
                      format: uuid
                      description: Optional. The ID of a delivery
                    ignoreLock:
                      type: boolean
                      description: Optional. Ignore locking out multiple users from working on the same order
                    confirmed:
                      type: boolean
                      description: Optional. When user has confirmed a prompt warning of re-assigning an active delivery attempt
                    serviceLevel:
                      type: string
                      description: Optional. The service level
                    manualOverride:
                      type: boolean
                      description: Optional. When user has confirmed a prompt warning of re-assigning and skipping certain checks on dispatching
                    lpRateCardId:
                      type: string
                      description: Optional. The ID of the rate card to use when manually assinging an LP to the delivery
                    shipperRateCardId:
                      type: string
                      description: Optional. The ID of the shipper rate card to use when manually assinging an LP to the delivery
                    shipperCost:
                      type: number
                      description: Optional. The cost of the shipper rate card to use when manually assinging an LP to the delivery
                    pickupMin:
                      type: number
                      description: Optional. The pickup min to use when manually assinging an LP to the delivery
                    dropoffMin:
                      type: number
                      description: Optional. The dropoff min to use when manually assinging an LP to the delivery
                    shippingMode:
                      type: string
                      description: Optional. The shipping mode to use when manually assinging an LP to the delivery
                      enum:
                      - FTL
                      - Hotshot
                      - InternalFleet
                      - LTL
                      - Parcel
                      - Routed
                    lpOrganizationId:
                      type: string
                      description: Optional. The organization id to use when manually assinging an LP to the delivery
      responses:
        '200':
          description: Object, return success:true and possibly other data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: True if operation was successful
                  data:
                    type: object
                    description: Optional returned data for the action
