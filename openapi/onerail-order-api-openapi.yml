  /v1/order/{orderId}/container/{containerId}/scan-history:
    parameters:
    - name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: containerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    servers:
    - url: /
      description: Default relative server URL
    get:
      x-exegesis-controller: Order
      summary: Get the scan history for a container inside an order
      operationId: getDeliveryContainerScanHistory
      tags:
      - Order
      responses:
        '200':
          description: Order Scan History
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    eventType:
                      type: string
                      example: PICKED_UP
                    evidenceType:
                      type: string
                      example: scan
                    evidenceData:
                      type: object
                      properties:
                        evidenceType:
                          type: string
                          example: LPN
                        evidenceValue:
                          type: string
                          example: 12345
                    location:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                          example: Store One
                        locationLocalTime:
                          type: string
                          example: '2023-11-07T09:21:23-08:00'
                    happenedOn:
                      type: string
                      example: '2023-11-07T17:21:23Z'
                    scanByParent:
                      type: boolean
                      example: true
                    deliveryId:
                      type: string
        '404':
          $ref: '#/paths/~1v1~1routes/get/responses/404'
        default:
          $ref: '#/paths/~1v1~1routes/get/responses/404'
      security:
      - bearer: []
  /v1/order/{orderId}/delivery/{deliveryId}/items:
    parameters:
    - name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: deliveryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: limit
      in: query
      required: false
      description: Maximum number of items to return in this page. When omitted, all items are returned.
      schema:
        type: integer
        minimum: 1
    - name: offset
      in: query
      required: false
      description: Number of items to skip before returning the page. Defaults to 0.
      schema:
        type: integer
        minimum: 0
    servers:
    - url: /
      description: Default relative server URL
    get:
      x-exegesis-controller: Order
      summary: Get a paginated list of a delivery's order items
      operationId: getOrderDeliveryItems
      tags:
      - Order
      responses:
