openapi: 3.2.0
info:
  version: 1.0.0
  title: OneRail Operation Dashboard Control Tower API
  description: Defines Operations Dashboard APIs
  license:
    name: UNLICENSED
    url: ''
servers:
- url: /
  description: Default relative server URL
security:
- bearer: []
tags:
- name: ControlTower
paths:
  /v1/bulk-rejection:
    post:
      x-exegesis-controller: ControlTower
      summary: Reject routes and deliveries
      operationId: bulkRejection
      tags:
      - ControlTower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Route ids or delivery ids to reject
              properties:
                deliveryIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                routeIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                reason:
                  type:
                  - object
                  - 'null'
                  properties:
                    title:
                      type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/paths/~1v1~1routes/get/responses/404'
        default:
          $ref: '#/paths/~1v1~1routes/get/responses/404'
  /v1/bulk-cancelation:
    post:
      x-exegesis-controller: ControlTower
      summary: Deletes routes and deliveries
      operationId: bulkCancelation
      tags:
      - ControlTower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Route ids or delivery ids to cancel
              properties:
                deliveryIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                routeIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                reason:
                  type: object
                  properties:
                    reason:
                      type: object
                      properties:
                        title:
                          type: string
                        id:
                          type: string
                        deliveryBillableToShipper:
                          type:
                          - boolean
                          - 'null'
                        deliveryPayableToLp:
                          type:
                          - boolean
                          - 'null'
                        shipperSlaWaived:
                          type:
                          - boolean
                          - 'null'
                        lpSlaWaived:
                          type:
                          - boolean
                          - 'null'
                    notes:
                      type:
                      - string
                      - 'null'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/paths/~1v1~1routes/get/responses/404'
        default:
          $ref: '#/paths/~1v1~1routes/get/responses/404'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'Standard JWT bearer token used for authenticated OmniPoint users

        and internal service-to-service calls. Clients send `Authorization: Bearer <jwt>`

        and the token is validated using the shared Core access token secret.

        '
    ApiKey:
      type: apiKey
      in: header
      name: X-ONERAIL-API-KEY
      description: 'Shared secret key used for machine-to-machine integrations. Must be sent

        together with `X-ONERAIL-APP-ID` and is validated against the stored ApiAuth

        record for that application.

        '
    AppId:
      type: apiKey
      in: header
      name: X-ONERAIL-APP-ID
      description: 'Application identifier (UUID) that pairs with `X-ONERAIL-API-KEY` for

        machine-to-machine integrations. Both headers are required for ApiKey-based

        authentication.

        '
    OAuth:
      type: oauth2
      description: 'OAuth 2.0 access token validated by the Operations service (e.g. Okta-backed

        integrations). Clients obtain tokens from their own IdP outside of this API

        and call endpoints with `Authorization: OAuth <access_token>`. The

        `authorizationUrl` and `tokenUrl` values below are placeholders only to

        satisfy the OpenAPI schema; this service does not call them directly and the

        real IdP URLs are configured via environment and introspection logic in code.

        '
      flows:
        authorizationCode:
          authorizationUrl: https://dummy-unused-url.com
          tokenUrl: https://dummy-unused-url.com
          scopes: {}
