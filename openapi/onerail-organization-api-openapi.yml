    parameters:
    - name: organizationId
      in: path
      required: true
      schema:
        type: string
    post:
      x-exegesis-controller: Organization
      summary: Create organization's service level
      operationId: createServiceLevel
      tags:
      - Organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                timeDesc:
                  type:
                  - string
                  - 'null'
                pickUpSpeedId:
                  type: string
                  format: uuid
                dropOffSpeedId:
                  type: string
                  format: uuid
                endOfDayMinutes:
                  type: integer
                  default: 0
                cutOffTimeMins:
                  type:
                  - integer
                  - 'null'
                  description: Cut off time in minutes since midnight
                enableClubbing:
                  type: boolean
                  description: If deliveries should be batched
                  default: false
                serviceLevelClubTriggers:
                  type:
                  - array
                  - 'null'
                  items:
                    $ref: '#/paths/~1v1~1service-level~1%7BserviceLevelId%7D~1trigger/post/requestBody/content/application~1json/schema'
                revokeTimeMins:
                  type: integer
                  description: Time in minutes before delivery is auto revoked. 0 = do not revoke
                enableConsolidation:
                  type: boolean
                  description: If enabling consolidation
                  default: false
                enableOptimization:
                  type: boolean
                  description: If enabling optimizing
                  default: false
                requireWindows:
                  type:
                  - boolean
                  - 'null'
                  default: false
                  description: If requireWindow is enabled
                requireImmediateDispatch:
                  type:
                  - boolean
                  - 'null'
                  default: false
                  description: To ignore pickup closed and cutoff time
                ignoreRevokes:
                  type:
                  - boolean
                  - 'null'
                  default: false
                  description: If requireWindow is enabled
                scheduleExpressPickup:
                  type: boolean
                  default: false
                  description: If scheduleExpressPickup is enabled
                rateShopByDeliveryDate:
                  type:
                  - boolean
                  - 'null'
                  default: false
                  description: If downgrading logic can be used to find a lower service level with a cheaper price but still acceptable delivery date
                active:
                  type: boolean
                  default: true
                  description: when disabled, the service level can't be used in new orders
                lpSpecificRevokeTimes:
                  type:
                  - array
                  - 'null'
                  items:
                    type: object
                    required:
                    - organizationId
                    - revokeTimeMins
                    properties:
                      organizationId:
                        type: string
                        format: uuid
                        description: The LP organization ID to set a specific revoke time for
                      revokeTimeMins:
                        type: integer
                        description: Time in minutes before delivery is auto revoked for this specific LP organization
                ignoreLTLRevokes:
                  type: boolean
                  default: false
                  description: when disabled, deliveries using this service level will not be auto revoked
      responses:
        '200':
          description: Service Level
          content:
            application/json:
              schema:
                type: object
                required:
                - name
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  timeDesc:
                    type:
                    - string
                    - 'null'
                  pickUpSpeedId:
                    type: string
                    format: uuid
                  dropOffSpeedId:
                    type: string
                    format: uuid
                  endOfDayMinutes:
                    type: integer
                  cutOffTimeMins:
                    type:
                    - integer
                    - 'null'
                    description: cut off time in minutes since midnight
                  enableClubbing:
                    type: boolean
                    description: If deliveries should be batched
                  revokeTimeMins:
                    type: integer
                    description: Time in minutes before delivery is auto revoked. 0 = do not revoke
                  enableConsolidation:
                    type: boolean
                    description: If consolidation is enabled
                  enableOptimization:
                    type: boolean
                    description: If optimizing is enabled
                  requireWindows:
                    type:
                    - boolean
                    - 'null'
                    default: false
                    description: If requireWindow is enabled
                  requireImmediateDispatch:
                    type:
                    - boolean
                    - 'null'
                    default: false
                    description: To ignore pickup closed and cutoff time
                  ignoreRevokes:
                    type:
                    - boolean
                    - 'null'
                    default: false
                    description: If ignoreRevokes is enabled
                  scheduleExpressPickup:
                    type: boolean
                    default: false
                    description: If scheduleExpressPickup is enabled
                  rateShopByDeliveryDate:
                    type:
                    - boolean
                    - 'null'
                    default: false
                    description: If downgrading logic can be used to find a lower service level with a cheaper price but still acceptable delivery date
                  useOwnRateCard:
                    type: boolean
                    default: true
                    description: Flag for Own-rate-card usage
                  allowRestock:
                    type: boolean
                    default: false
                    description: driver service mode
                  shipperLpConfigurations:
                    type: array
                    items:
                      $ref: '#/paths/~1v1~1organization~1shipper-lp-configuration/post/requestBody/content/application~1json/schema/properties/shipperLpConfigurations/items'
                  lpSpecificRevokeTimes:
                    type: array
                    items:
                      type: object
                      properties:
                        organizationId:
                          type: string
                          format: uuid
                        revokeTimeMins:
                          type: integer
                          description: Time in minutes before delivery is auto revoked for this specific LP organization
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                  active:
                    type: boolean
                    default: true
                    description: when disabled, the service level can't be used in new orders
        '404':
          $ref: '#/paths/~1v1~1routes/get/responses/404'
        default:
          $ref: '#/paths/~1v1~1routes/get/responses/404'
