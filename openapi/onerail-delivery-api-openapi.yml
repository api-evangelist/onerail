          type: array
          items:
            type: string
            enum:
            - DRAFT
            - READY_TO_DISPATCH
            - SCHEDULED
            - DISPATCHING
            - ASSIGNED
            - ACCEPTED_BY_LP
            - CANCELED_BY_LP
            - REVOKED_BY_ONERAIL
            - DISPATCH_ERROR
            - DRIVER_ASSIGNED
            - EN_ROUTE_TO_PICKUP
            - ARRIVED_FOR_PICKUP
            - PICKED_UP
            - EN_ROUTE_TO_DELIVERY
            - ARRIVED_FOR_DELIVERY
            - DELIVERED
            - INCOMPLETE
            - ONERAIL_PROCESSING
            - CANCELED_BY_ONERAIL
            - CANCELED_BY_SHIPPER
            - ROUTED
