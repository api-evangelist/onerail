          type: string
          default: default
          enum:
          - default
          - dashboard
          - needs-attention
          - control-tower
          - deliveries
      - name: customField
        in: query
        description: Filter's by custom fields specific to each shipper.  The parameter is provided as `customField=fieldName:value`.  Can be provided more than once for multiple values or fields.
        required: false
        schema:
          type: array
          items:
            type: string
