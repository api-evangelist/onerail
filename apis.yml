aid: onerail
name: OneRail
description: >-
  OneRail is an Orlando, Florida based last-mile delivery orchestration company whose OmniPoint platform unifies
  fragmented delivery ecosystems into a single decisioning and execution layer for enterprise shippers. The platform
  rate-shops and dispatches orders across a courier marketplace of 1,000+ connected carriers and 12M+ drivers,
  optimizes multi-stop routes for internal fleets under vehicle-capacity, market-hours and appointment-window
  constraints, and streams delivery events back to the shipper for end-to-end visibility and proof of delivery.
  Developers integrate through two documented REST surfaces published from the OneRail Developer Hub - the Delivery
  API (order creation, rate shopping, partial updates, cancellation, shipping labels, routes, and visibility-only
  tracking for shipments fulfilled outside the OneRail network) and the Operations API (organizations, locations,
  users, markets, fleet assets, contracts, SLAs, and API credentials). Both are authenticated with an organization
  App ID / API Key header pair, and delivery status changes are pushed to shipper-configured webhook endpoints.
  OneRail is embedded in the IBM Sterling Order Management and Fulfillment Suite and in SAP environments, and serves
  wholesale, retail, automotive, pharma, industrial, grocery, furniture, and food and beverage shippers.
accessModel:
  pricing: unknown
  onboarding: sales-assisted
  trial: false
  try_now: false
  public: false
  label: Contact sales
  confidence: high
  source:
  - https://developer.onerail.io/hc/en-us/articles/50724541394971-Getting-Started-with-Delivery-API
  - https://developer.onerail.io/hc/en-us/articles/53169025821339-CapacityConnect-API-Quickstart-Guide
  note: >-
    OneRail publishes no pricing page and no self-serve signup. The App ID / API Key pair is created for
    each shipper organization by the OneRail product team and distributed via customer success
    (support@onerail.io); platform users must already exist before they can authenticate. Access starts
    with a demo request.
