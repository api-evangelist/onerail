apis:
- name: OneRail Delivery API
  description: >-
    The OmniPoint Delivery API lets authorized shippers request, price, update, and track deliveries through the
    OneRail carrier network. It covers rate shopping across qualified carriers, order and delivery creation
    (order-first and delivery-first), progressive partial updates on draft orders, availability checks, delivery
    pre-validation, rescheduling, cancellation, shipping-label and manifest generation, scan data, multi-stop route
    creation with an optional optimizer bypass, and visibility-only tracking for shipments fulfilled outside the
    OneRail booking process.
  humanURL: https://developer.onerail.io/hc/en-us/articles/50724541394971-Getting-Started-with-Delivery-API
  baseURL: https://onerail-delivery-api-prod.azurewebsites.net
