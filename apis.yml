- name: OneRail Operations API
  description: >-
    The OmniPoint Operations (Operation Dashboard) API administers the shipper account behind the Delivery API:
    organizations and their preferences, pickup and drop-off locations with service hours and cut-off times, users
    and roles, teams, markets and zones, fleet assets and vehicles, drivers, logistics partners and carrier
    contracts, service levels and SLAs, holidays, notifications, and the App ID / API Key credential records used to
    authenticate machine-to-machine integrations.
  humanURL: https://developer.onerail.io/hc/en-us/articles/53169025821339-CapacityConnect-API-Quickstart-Guide
