standards:
- id: oauth2
  conforms: true
  evidence: Operations API declares an oauth2 securityScheme (authorizationCode flow); Delivery API exposes
    POST /oauth2/token for client-credentials exchange. Note the spec states the authorizationUrl/tokenUrl
    values are placeholders and the real IdP is customer-configured.
  confidence: medium
- id: oidc
  conforms: false
  evidence: No openIdConnect securityScheme and no /.well-known/openid-configuration on any OneRail host.
- id: http-bearer-jwt
  conforms: true
  evidence: Operations API declares an http/bearer scheme described as a JWT validated against the shared
    Core access token secret.
- id: api-key-header
  conforms: true
  evidence: Both APIs declare apiKey-in-header schemes X-ONERAIL-APP-ID and X-ONERAIL-API-KEY.
- id: openapi-3.0
